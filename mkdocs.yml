site_name: furiosa-opt-models
site_description: Models written in Rust for the FuriosaAI RNGD accelerator
site_url: https://developer.furiosa.ai/furiosa-opt-models/
repo_url: https://github.com/furiosa-ai/furiosa-opt-models
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: Geist
    code: Geist Mono
  logo: assets/furiosa.svg
  favicon: assets/favicon-64.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/circle-half-full
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.footer
    - navigation.sections
    - navigation.top
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - theme/extra.css

extra_javascript:
  - theme/dashboard.js

copyright: Copyright &copy; 2026 FuriosaAI, Inc.

extra:
  generator: false

exclude_docs: |
  /theme/partials/
  /theme/data/
  /theme/macros.py
  /theme/__pycache__/

validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn

markdown_extensions:
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - macros:
      include_yaml:
        - benchmarks: .github/benchmarks.json
        - dashboards: .github/dashboard/dashboards.json
      include_dir: docs/theme/partials
      module_name: docs/theme/macros
      on_undefined: strict
  - mkdocstrings:
      handlers:
        python:
          paths: [crates/furiosa-opt-engine/python]
          options:
            heading_level: 3
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_if_no_docstring: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            filters: ["!^_(?!_new__$)"]

nav:
  - Home: index.md
  - Getting started:
      - getting-started/installation.md
      - getting-started/quickstart.md
  - User guide:
      - serving/index.md
      - engine/python.md
      - concepts.md
      - reference/troubleshooting.md
  - Models:
      - models/index.md
      - Text generation:
          - Qwen3:
              - models/qwen3-0.6b.md
              - models/qwen3-1.7b.md
              - models/qwen3-4b.md
              - models/qwen3-8b.md
          - Llama:
              - models/llama3-8b.md
          - Mistral:
              - models/mistral-7b.md
              - models/mistral-nemo.md
          - Gemma 4:
              - models/gemma4-12b.md
      - Embedding & reranking:
          - Qwen3:
              - models/qwen3-embedding.md
              - models/qwen3-reranker.md
  - Developer guide:
      - design/architecture.md
      - develop/compose.md
      - develop/add-model.md
      - develop/kernel.md
      - engine/frameworks.md
      - develop/testing.md
      - design/testing.md
  - Reference:
      - reference/python.md
      - reference/rust.md
      - serving/vllm.md
      - serving/sglang.md
      - reference/environment.md
