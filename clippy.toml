# Only module items: impls, enums and structs keep their author's order of importance, which the
# default alphabetical order would undo.
source-item-ordering = ["module"]
# Imports, then items with their impls, then the free functions that serve them. Modules sit with
# the items, since clippy cannot tell an inline module of a type's variants from a `mod x;`.
module-item-order-groupings = [
    ["imports", ["use"]],
    ["items", ["extern_crate", "mod", "foreign_mod", "macro", "global_asm", "static", "const", "ty_alias", "enum", "struct", "union", "trait", "trait_alias", "impl"]],
    ["functions", ["fn"]],
]
