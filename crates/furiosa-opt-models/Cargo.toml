[package]
name = "furiosa-opt-models"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Model functions for FuriosaAI NPUs"
repository = "https://github.com/furiosa-ai/furiosa-opt-models"
homepage = "https://developer.furiosa.ai/furiosa-opt-models/"
readme = "README.md"

[package.metadata.furiosa-opt]

[dependencies]
furiosa-opt-std = { workspace = true }
furiosa-opt-models-macros = { path = "macros", version = "0.1.0" }
futures-executor = "0.3"
half = "2"
memmap2 = "0.9"
ndarray = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_path_to_error = "0.1"
safetensors = "=0.4.5"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[features]
# Checkpoints edited tensor by tensor, for the tests of crates that load them.
test-support = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(backend, values("npu"))'] }
