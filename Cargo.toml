[workspace]
resolver = "3"
members = [
    "crates/furiosa-opt-engine",
    "crates/furiosa-opt-models",
    "crates/furiosa-opt-models/macros",
    "crates/furiosa-opt-python",
]

# Pin the cloneable DMA-context API from furiosa-opt-preview#4. Cache workers can then submit
# through independent handles to the shared device without taking the model-context mutex.
[workspace.dependencies]
furiosa-opt-std = { git = "https://github.com/furiosa-ai/furiosa-opt-preview", rev = "3b2e03253605c934d1cf2112c2e5c928eda2e409" }

# The engine's monomorphized debug info overflows the linker's 4 GiB debug sections.
[profile.dev.package.furiosa-opt-engine]
debug = false
